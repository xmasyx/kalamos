name: Release

# Tag a commit and the release builds itself:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces Kalamos.zip and attaches it to a GitHub Release, which is what
# Scripts/install.sh downloads. Also runnable by hand from the Actions tab
# (without a tag it builds and uploads an artifact but publishes nothing).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    # macOS 15 runners are Apple Silicon — required: Kalamos links MLX and
    # WhisperKit, both of which build against Metal and the Neural Engine.
    runs-on: macos-15

    steps:
      # Un rilascio ad-hoc cambia identità a ogni build e macOS azzera i permessi già concessi.
      # Questo preflight viene prima perfino del checkout: senza la chiave non esiste un fallback
      # accettabile e il runner deve dirlo prima di spendere tempo in una build che non può uscire.
      - name: Signing secrets preflight
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" ]]; then
            echo "::error::manca MACOS_CERT_P12: Scripts/make-signing-cert.sh crea l'identità; esportala da Accesso Portachiavi come .p12; base64 -i cert.p12 | pbcopy; incolla il risultato nel secret del repository"
            exit 1
          fi
          if [[ -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "::error::manca MACOS_CERT_PASSWORD: salva nel secret del repository la password usata per esportare il .p12"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # MLX compiles Metal shaders into default.metallib at build time. Since
      # Xcode 26 the Metal toolchain is a separate component, and when it is
      # absent the build does NOT fail loudly — it produces an app whose AI
      # cleanup dies at runtime. Prove the compiler exists before building.
      - name: Verify the Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version 2>/dev/null; then
            echo "Metal compiler missing — downloading the component…"
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version \
              || { echo "::error::No Metal compiler on this runner. MLX cannot build."; exit 1; }
          fi

      - name: Run tests
        # Seriale, e non è pigrizia: in parallelo un processo che muore porta
        # giù la decina di test in volo, e il registro non dice quale sia stato
        # (17/08, tre corse a interpretare un insieme di sospetti). Serializzato,
        # l'ultimo test avviato È il colpevole.
        run: swift test --no-parallel

      # `-T` da solo non basta: senza la partition list il primo codesign aspetta una finestra di
      # Portachiavi invisibile sul runner. È un blocco già pagato, non una cautela teorica.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/kalamos-signing.keychain-db"
          KEYCHAIN_PASSWORD="kalamos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          P12="$RUNNER_TEMP/kalamos-signing.p12"
          CERT="$RUNNER_TEMP/kalamos-signing.pem"

          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS=()
          while IFS= read -r existing; do
            EXISTING_KEYCHAINS+=("$existing")
          done < <(security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          # Un certificato autofirmato importato non è ancora *fidato*, e `find-identity -v` scarta
          # le identità non fidate: senza questa riga la firma non troverebbe «Kalamos Dev» e
          # build-app.sh uscirebbe 6. La fiducia si scrive nel dominio di amministrazione con
          # `sudo`, non in quello dell'utente: la forma utente apre una finestra di autorizzazione
          # che su un runner senza schermo nessuno può chiudere.
          security find-certificate -c "Kalamos Dev" -p "$KEYCHAIN" > "$CERT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Kalamos Dev" \
            || { echo "::error::il .p12 non contiene l'identità di firma Kalamos Dev"; exit 1; }

      - name: Build Kalamos.app
        env:
          KALAMOS_NO_INSTALL: "1"
          KALAMOS_RELEASE: "1"          # ad-hoc is forbidden in a release artifact
        run: |
          # On a tag, the tag IS the version — the app must not be free to say
          # something else. Off a tag there is no version to claim.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export KALAMOS_VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Il bundle di lavorazione vive fuori dal progetto dal 30/08, ma qui il
          # path storico è quello che i passi successivi (firma, DMG, staging) si
          # aspettano: si dichiara, invece di dipendere dal solo $CI del runner.
          export KALAMOS_BUILD_DIR=build
          ./Scripts/build-app.sh Release

      - name: Verify the signature
        run: |
          APP="build/Kalamos.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Authority=Kalamos Dev'
          codesign --verify --deep --strict "$APP"

      # A bundle missing default.metallib looks perfectly healthy until a user
      # turns on AI cleanup. Refuse to ship one.
      # `Authority=<Nome> Dev` è un controllo sul NOME, e un altro certificato autofirmato con lo
      # stesso Common Name lo supererebbe: macOS non guarda la stringa, guarda il designated
      # requirement, e un'identità diversa azzera i permessi TCC già concessi (Accessibilità,
      # microfono). Qui l'impronta della foglia è fissata a quella dell'identità vera, letta
      # dall'app firmata. Rilievo dell'audit cross-vendor del 2026-08-30; due poli misurati:
      # exit 0 contro la propria identità, exit 3 contro un'impronta diversa.
      - name: Pin the signing identity
        run: |
          APP="build/Kalamos.app"
          REQ='identifier "com.kalamos.app" and certificate leaf = H"c613131fa65afc71b10ffaea5927ea7ffc708f47"'
          codesign --verify --strict -R="$REQ" "$APP" \
            || { echo "::error::il bundle non soddisfa il designated requirement fissato: un certificato diverso azzererebbe i permessi gia concessi"; exit 1; }

      # La logica del tasto nei sorgenti non prova che il binario SPEDITO lo esponga: fino al
      # 2026-08-30 le tre release pubblicate non lo contenevano, e nessun cancello lo diceva.
      - name: The published binary carries the update button
        run: |
          strings "build/Kalamos.app/Contents/MacOS/Kalamos" | grep -qF 'Check for updates' \
            || { echo "::error::il binario non contiene il tasto di aggiornamento"; exit 1; }

      - name: Verify the bundle
        run: |
          APP="build/Kalamos.app"
          test -x "$APP/Contents/MacOS/Kalamos"          || { echo "::error::no executable"; exit 1; }
          test -f "$APP/Contents/Info.plist"           || { echo "::error::no Info.plist"; exit 1; }
          test -f "$APP/Contents/Resources/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib" \
            || { echo "::error::default.metallib missing — AI cleanup would fail at runtime"; exit 1; }
          # Fail-closed on the version, because the failure is silent: a
          # release whose binary reports the previous number looks perfect
          # everywhere except in the one place a user checks it.
          REPORTED="$("$APP/Contents/MacOS/Kalamos" --version)"
          echo "$REPORTED"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EXPECTED="Kalamos ${GITHUB_REF_NAME#v}"
            [ "$REPORTED" = "$EXPECTED" ] \
              || { echo "::error::binary says '$REPORTED', the tag says '$EXPECTED'"; exit 1; }
          fi

      - name: Package
        run: ditto -c -k --keepParent build/Kalamos.app Kalamos.zip

      # Il DMG, per chi scarica a mano invece di usare l'installatore.
      #
      # Costruito qui dentro con `hdiutil` e non da uno strumento di sistema: un runner GitHub è
      # una macchina nuda, e un passo che dipende da qualcosa fuori dal repo è un passo che
      # funziona solo sul Mac di chi l'ha scritto.
      - name: Make the DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "build/Kalamos.app/Contents/Info.plist")"
          DMG="Kalamos-${VERSION}.dmg"
          STAGE="$(mktemp -d)"
          cp -R "build/Kalamos.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kalamos ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # Un DMG che si crea senza errori può contenere un bundle rotto, e la differenza si vede
          # solo montandolo. Meglio qui che nella cartella Download di chi lo scarica.
          MNT="$(hdiutil attach "$DMG" -nobrowse -readonly | grep -o '/Volumes/.*' | head -1)"
          # Si smonta SEMPRE, anche quando il controllo boccia: uscire prima del `detach` lascia un
          # volume montato in giro, e su una macchina che non è un runner usa-e-getta resta lì.
          trap 'hdiutil detach "$MNT" -quiet 2>/dev/null || true' EXIT
          test -x "$MNT/Kalamos.app/Contents/MacOS/Kalamos" \
            || { echo "::error::no executable inside the DMG"; exit 1; }
          codesign -dv --verbose=2 "$MNT/Kalamos.app" 2>&1 | grep -q 'Authority=Kalamos Dev'
          codesign --verify --deep --strict "$MNT/Kalamos.app" \
            || { echo "::error::the signature does not hold inside the DMG"; exit 1; }
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          echo "the DMG is $DMG"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalamos.app
          path: Kalamos.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Kalamos.zip "${DMG}" \
            --title "Kalamos ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "
          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/Scripts/install.sh | bash
          \`\`\`

          Requires macOS 14+ on Apple Silicon. Builds are signed with the project's own
          certificate, not notarized: the installer clears the quarantine flag — read the script first.
          "

      # Il portachiavi contiene la chiave privata del rilascio: si elimina anche quando un cancello
      # precedente va rosso, non soltanto nel percorso felice.
      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kalamos-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/kalamos-signing.p12" "$RUNNER_TEMP/kalamos-signing.pem"
